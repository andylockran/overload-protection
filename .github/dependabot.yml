version: 2
updates:
  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"

  # npm dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "npm"
    versioning-strategy: increase
    groups:
      # Group vitest-related dependencies together
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
          - "vite"
          - "vite-node"
      # Group development tools together
      dev-tools:
        patterns:
          - "standard"
          - "autocannon"
          - "pre-commit"
